<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>KubeAssist architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}
      .t{font-size:15px;font-weight:600;fill:#0f172a}
      .s{font-size:12px;fill:#475569}
      .lbl{font-size:11.5px;fill:#334155}
      .ln{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .dash{stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="960" height="560" rx="14" fill="#f8fafc"/>

  <!-- zones -->
  <rect x="190" y="40" width="470" height="400" rx="12" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="206" y="62" class="s" font-weight="600">KubeAssist server (Flask)</text>
  <rect x="690" y="40" width="250" height="400" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="706" y="62" class="s" font-weight="600">External systems</text>

  <!-- browser -->
  <rect class="box" x="24" y="190" width="140" height="80" rx="10"/>
  <text x="94" y="224" text-anchor="middle" class="t">Browser UI</text>
  <text x="94" y="245" text-anchor="middle" class="s">chat · approve · history</text>

  <!-- api -->
  <rect class="box" x="214" y="190" width="150" height="80" rx="10"/>
  <text x="289" y="224" text-anchor="middle" class="t">JSON API</text>
  <text x="289" y="245" text-anchor="middle" class="s">api.py · tokens · limits</text>

  <!-- planner -->
  <rect class="box" x="214" y="84" width="150" height="70" rx="10"/>
  <text x="289" y="114" text-anchor="middle" class="t">Planner</text>
  <text x="289" y="134" text-anchor="middle" class="s">picks a strategy</text>

  <!-- guard / runner -->
  <rect class="box" x="214" y="300" width="150" height="64" rx="10"/>
  <text x="289" y="327" text-anchor="middle" class="t">Command guard</text>
  <text x="289" y="347" text-anchor="middle" class="s">allow-list · risk level</text>
  <rect class="box" x="214" y="378" width="150" height="48" rx="10"/>
  <text x="289" y="408" text-anchor="middle" class="t">Runner</text>

  <!-- planner helpers -->
  <rect class="box" x="448" y="84" width="190" height="58" rx="10"/>
  <text x="543" y="110" text-anchor="middle" class="t">LLM client</text>
  <text x="543" y="128" text-anchor="middle" class="s">JSON reply parser</text>
  <rect class="box" x="448" y="156" width="190" height="58" rx="10"/>
  <text x="543" y="182" text-anchor="middle" class="t">Rules engine</text>
  <text x="543" y="200" text-anchor="middle" class="s">offline fallback</text>
  <rect class="box" x="448" y="228" width="190" height="58" rx="10"/>
  <text x="543" y="254" text-anchor="middle" class="t">Knowledge base</text>
  <text x="543" y="272" text-anchor="middle" class="s">BM25 or vector search</text>
  <rect class="box" x="448" y="300" width="190" height="64" rx="10"/>
  <text x="543" y="328" text-anchor="middle" class="t">Session store</text>
  <text x="543" y="347" text-anchor="middle" class="s">SQLite · pending · audit</text>
  <rect class="box" x="448" y="378" width="190" height="48" rx="10"/>
  <text x="543" y="407" text-anchor="middle" class="t">Cluster registry</text>

  <!-- external -->
  <rect class="box" x="712" y="84" width="206" height="70" rx="10"/>
  <text x="815" y="114" text-anchor="middle" class="t">Ollama</text>
  <text x="815" y="134" text-anchor="middle" class="s">local language model</text>
  <rect class="box" x="712" y="228" width="206" height="58" rx="10"/>
  <text x="815" y="254" text-anchor="middle" class="t">knowledge/*.md</text>
  <text x="815" y="272" text-anchor="middle" class="s">your docs &amp; runbooks</text>
  <rect class="box" x="712" y="378" width="206" height="48" rx="10"/>
  <text x="815" y="407" text-anchor="middle" class="t">kubectl → clusters</text>

  <!-- arrows -->
  <path class="ln" d="M164 230H214"/>
  <path class="ln" d="M289 190V154"/>
  <path class="ln" d="M364 105H448"/>
  <path class="ln dash" d="M364 120L448 178"/>
  <path class="ln" d="M364 135L448 246"/>
  <path class="ln" d="M638 113H712"/>
  <path class="ln" d="M638 257H712"/>
  <path class="ln" d="M289 270V300"/>
  <path class="ln" d="M289 364V378"/>
  <path class="ln" d="M364 402H448"/>
  <path class="ln" d="M638 402H712"/>
  <path class="ln dash" d="M364 250L448 330"/>

  <!-- legend -->
  <text x="24" y="478" class="s" font-weight="600">Reading the diagram</text>
  <text x="24" y="498" class="lbl">Solid arrows: normal flow.  Dashed: fallback / bookkeeping.</text>
  <text x="24" y="518" class="lbl">Nothing reaches kubectl until the user approves and the guard re-validates the command.</text>
</svg>
