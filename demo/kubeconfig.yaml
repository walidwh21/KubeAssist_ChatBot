# Sample kubeconfig for the offline demo. It contains no real servers or credentials.
apiVersion: v1
kind: Config
current-context: dev-cluster
clusters:
  - name: dev
    cluster: {server: "https://127.0.0.1:6443"}
  - name: staging
    cluster: {server: "https://127.0.0.1:6444"}
users:
  - name: demo-user
    user: {}
contexts:
  - name: dev-cluster
    context: {cluster: dev, user: demo-user}
  - name: staging-cluster
    context: {cluster: staging, user: demo-user}
